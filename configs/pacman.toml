# Pac-Man demo: the model picks Pac-Man's next move; see demos/pacman/README.md.

[scenario]
name = "pacman"
languages = ["en"]
data = "data/external/pacman_train.csv"
test = "data/external/pacman_test.csv"
model = "models/pacman.joblib"
license = "mit"
ship_data = false
input = "text"
dataset_name = "NextAction Pac-Man expert games"
decision = "the next move of Pac-Man in a grid maze"
example = "[blocked up down] [danger none] [features wall_up wall_down food_left_0 ghost_left_close food_right_0 ghost_right_close closest_food_left safest_left threat_mid power_no]"
data_source = "moves of a rule-based expert in games generated by `demos/pacman/generate_data.py`"
demo = "demos/pacman"
media = "demos/pacman/pacman.gif"
demo_summary = "Over 300 unseen games, the model wins 39% against the expert's 35% (overlapping 95% intervals) and hands 3.3% of moves to the expert when its confidence is below 0.6. Sending more moves to the expert does not win more games, because the expert is no stronger than the model it taught; every loss ends with Pac-Man trapped, every open move next to a ghost."
direct_use = "Choose Pac-Man's next move in the NextAction demo, as a worked example of imitation learning with a decision policy: state-based action masks, a confidence threshold and fallback to an expert."
out_of_scope = "Other mazes or game rules without retraining, and any claim of strong play: the model imitates a greedy rule-based expert and inherits its mistakes."
actions = { up = "move one cell up", down = "move one cell down", left = "move one cell left", right = "move one cell right" }
risk = "The expert wins only about a third of the games, so the model learns its mistakes too; per-move features cannot see dead ends several moves ahead."

[model]
ngram_range = [1, 2]  # bigrams pair a direction's food and ghost tokens
min_df = 2
C = 1.0
class_weight = "none"
max_iter = 1000
calibration = "none"

[tuning]
sample = 30000
folds = 3
metric = "accuracy"
C = [0.3, 1.0, 3.0, 10.0]
ngram_range = [[1, 1], [1, 2]]

[policy]
default_threshold = 0.6   # below this, the expert decides (the "human review" of the game)
review_cost = 1.0

# The environment lists walls and moves next to a ghost in the state; the policy denies them.
[[policy.rules]]
id = "no_walls"
deny_tag = "blocked"

[[policy.rules]]
id = "avoid_adjacent_ghosts"
deny_tag = "danger"
