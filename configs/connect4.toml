# Connect Four demo: the model picks the column to play; see demos/connect4/README.md.

[scenario]
name = "connect4"
alias = "lig4"
languages = ["en"]
data = "data/external/connect4_train.csv"
test = "data/external/connect4_test.csv"
model = "models/connect4.joblib"
license = "mit"
ship_data = false
input = "text"
dataset_name = "NextAction Connect Four teacher games"
decision = "the column to play in Connect Four"
example = "[blocked none] [danger none] [features c1_better c2_better c3_better c4_good c5_better c6_better c7_better hc1_0 hc2_0 hc3_0 hc4_0 hc5_0 hc6_0 hc7_0]"
data_source = "positions labeled with the move of a depth-4 alpha-beta search, from games generated by `demos/connect4/generate_data.py`"
demo = "demos/connect4"
media = "demos/connect4/connect4.gif"
demo_summary = "In 200 games against a depth-4 search, the model alone wins 19%. With moves below 0.5 confidence reviewed by a depth-6 search it wins 40%, at its teacher's level (38%), and 13 games more than when the depth-4 teacher reviews instead; the 95% intervals overlap, so the last difference is suggestive."
direct_use = "Choose a Connect Four column in the NextAction demo, as an example of a model whose unsure moves are reviewed by a stronger search."
out_of_scope = "Competitive play: alone the model is much weaker than the search it imitates; it needs the reviewer to play at that level."
actions = { c1 = "drop a disc in column 1 (leftmost)", c2 = "drop a disc in column 2", c3 = "drop a disc in column 3", c4 = "drop a disc in column 4 (center)", c5 = "drop a disc in column 5", c6 = "drop a disc in column 6", c7 = "drop a disc in column 7 (rightmost)" }
risk = "Imitation accuracy is 0.67, and in a tactical game a single bad move can lose; several columns are often equally good, so accuracy understates move quality."

[model]
ngram_range = [1, 2]
min_df = 2
C = 1.0
class_weight = "none"
max_iter = 1000
calibration = "none"

[tuning]
sample = 30000
folds = 3
metric = "accuracy"
C = [0.3, 1.0, 3.0]
ngram_range = [[1, 1], [1, 2]]

[policy]
default_threshold = 0.5   # below this, a deeper search (depth 6) reviews the move
review_cost = 1.0

[[policy.rules]]
id = "no_full_columns"
deny_tag = "blocked"

[[policy.rules]]
id = "no_gifting_a_win"     # don't play under a cell where the opponent would connect four
deny_tag = "danger"
