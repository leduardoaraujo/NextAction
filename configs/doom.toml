[scenario]
name = "doom"
languages = ["en"]
data = "data/external/doom_train.csv"
test = "data/external/doom_test.csv"
model = "models/doom.joblib"
license = "mit"
ship_data = false
input = "text"
dataset_name = "NextAction ViZDoom Deathmatch teacher games"
decision = "navigate, aim and fight in ViZDoom Deathmatch"
example = "[enemy visible] [aim left] [size mid] [health ok] [ammo ready] [wall far]"
data_source = "rule-based teacher episodes recorded by demos/doom/generate_data.py"
demo = "demos/doom"
media = "demos/doom/doom.gif"
direct_use = "Choose a discrete action in ViZDoom Deathmatch from visible-object labels, depth, health and ammo."
out_of_scope = "Other Doom maps, enemies, visual-only play and claims of general game-playing ability."
actions = { advance = "move forward", turn_right = "turn to leave a wall", aim_left = "turn left and fire", aim_right = "turn right and fire", advance_fire = "move forward and fire", fire = "fire while standing" }

[model]
ngram_range = [1, 2]
min_df = 1
C = 1.0
class_weight = "none"
max_iter = 1000
calibration = "none"

[policy]
default_threshold = 0.6
