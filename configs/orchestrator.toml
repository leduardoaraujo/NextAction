# Next-action routing for an AI data workspace, inspired by Axis's agent boundary.

[scenario]
name = "orchestrator"
alias = "orquestrador"
languages = ["pt", "en"]
data = "data/orchestrator_train.csv"
validation = "data/orchestrator_validation.csv"
test = "data/orchestrator_test.csv"
model = "models/orchestrator.joblib"
license = "mit"
ship_data = true
input = "text"
dataset_name = "NextAction synthetic AI orchestrator cases"
decision = "choose the next step of an AI data-workspace orchestrator"
example = "[blocked none] [context datasource_available last_error_none missing_none] || user: Compare monthly revenue by region"
data_source = "hand-authored synthetic request families inspired by the routing boundary in leduardoaraujo/axis; no Axis user logs or private data"
demo = "demos/orchestrator"
direct_use = "Demonstrate and benchmark a small auditable next-action router for an AI data workspace."
out_of_scope = "Production routing without evaluation on representative user traces; SQL generation or result validation."
actions = { data_query = "hand an analytical request to a data analyst agent", pure_chat = "hand general conversation to a conversation agent", clarification_needed = "ask for missing source, metric or intent", error_recovery = "recover from a previous analytical error" }
risk = "Incorrect routing can waste model calls, confuse users, or send a data request to the wrong agent."

[model]
ngram_range = [1, 2]
min_df = 1
C = 3.0
class_weight = "none"
max_iter = 1000
calibration = "none"

[policy]
default_threshold = 0.55
review_cost = 1.0

[policy.actions.data_query]
risk = "medium"
unreviewed_error_cost = 8.0
min_confidence = 0.48

[policy.actions.pure_chat]
unreviewed_error_cost = 3.0
min_confidence = 0.38

[policy.actions.clarification_needed]
unreviewed_error_cost = 2.0
min_confidence = 0.44

[policy.actions.error_recovery]
risk = "medium"
unreviewed_error_cost = 5.0
min_confidence = 0.53

[[policy.rules]]
id = "no_data_agent_without_source"
deny_tag = "blocked"
