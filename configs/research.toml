# Research agent deciding whether to search, ask or answer (Portuguese, synthetic).

[scenario]
name = "research"
alias = "pesquisa"
languages = ["pt"]
data = "data/research.csv"
model = "models/research.joblib"
input = "text"
dataset_name = "OpenDecision research (synthetic)"
decision = "the next action of a research agent"
example = "Preciso saber a cotação de hoje e ainda não consultei nenhuma fonte"
data_source = "hand-written **synthetic** examples in Portuguese; they do not come from real users"

[model]
ngram_range = [1, 2]
min_df = 1
C = 1.0
class_weight = "none"
max_iter = 1000
calibration = "none"

[tuning]
folds = 4
metric = "f1_macro"
C = [0.3, 1.0, 3.0, 10.0]
ngram_range = [[1, 1], [1, 2]]

[policy]
default_threshold = 0.7
review_cost = 1.0

[policy.actions.answer]
risk = "medium"                 # answering without sources can spread stale information
unreviewed_error_cost = 5

[policy.actions.search]
unreviewed_error_cost = 1

[policy.actions.ask]
unreviewed_error_cost = 2
