[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nextaction"
version = "0.2.0"
description = "A small, auditable next-action model for AI agents, with English and Portuguese support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Araujo" }]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "pydantic>=2.7,<3",
    "rich>=13,<16",
    "tomlkit>=0.12,<1",
    "scikit-learn>=1.6,<2",
]
keywords = ["agents", "decision-making", "text-classification", "scikit-learn", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
api = ["fastapi>=0.120,<1", "uvicorn>=0.30,<1"]
hf = ["skops>=0.11,<1", "huggingface_hub>=0.30,<2"]
embeddings = ["sentence-transformers>=3,<6"]
demo = ["pillow>=10,<13", "matplotlib>=3.8,<4"]
translate = ["transformers>=4.40,<6", "sentencepiece>=0.2,<1", "torch>=2.3"]
dev = ["nextaction[api,hf]", "httpx>=0.27,<1", "coverage[toml]>=7.4,<8"]

[project.scripts]
nextaction = "nextaction.cli:main"

[project.urls]
Repository = "https://github.com/leduardoaraujo/NextAction"

[tool.setuptools.packages.find]
include = ["nextaction*"]

[tool.setuptools.package-data]
nextaction = ["static/*.html"]
