name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python scripts/test_report.py --output test-report.md
      - name: Publish test report
        if: always()
        run: if [ -f test-report.md ]; then cat test-report.md >> "$GITHUB_STEP_SUMMARY"; fi

  rust-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: cargo build --locked --manifest-path clients/rust/Cargo.toml
